<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c63ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Critter Match">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="register-sw.js" defer></script>
  <title>Cartoon Critter Match</title>

  <style>
    :root {
      color-scheme: light;
      --purple: #6c63ff;
      --purple-dark: #4d46d8;
      --pink: #ff6fae;
      --cream: #fff8ec;
      --ink: #302c4d;
      --white: #ffffff;
      --shadow: 0 8px 0 rgba(48, 44, 77, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #ffe284 0 9%, transparent 10%),
        radial-gradient(circle at 88% 14%, #ff9fc7 0 7%, transparent 8%),
        linear-gradient(160deg, #b7e9ff 0%, #ddd0ff 52%, #ffcbe0 100%);
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font: inherit;
    }

    .menu-link {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 3px solid var(--white);
      border-radius: 15px;
      color: var(--white);
      background: var(--purple);
      box-shadow: 0 5px 0 var(--purple-dark);
      font-size: 1.35rem;
      font-weight: 900;
      text-decoration: none;
      touch-action: manipulation;
    }

    .menu-link:active {
      box-shadow: 0 2px 0 var(--purple-dark);
      transform: translateY(3px);
    }

    .game {
      width: min(100%, 480px);
    }

    .title {
      margin: 6px 0 4px;
      color: var(--white);
      font-size: clamp(2rem, 10vw, 3rem);
      line-height: 1;
      text-align: center;
      text-shadow: 0 5px 0 var(--purple-dark);
    }

    .subtitle {
      margin: 10px 0 20px;
      color: #494268;
      font-size: 0.95rem;
      font-weight: 800;
      text-align: center;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 10px 6px;
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 5px 0 rgba(77, 70, 216, 0.18);
      text-align: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .stat-label {
      display: block;
      margin-bottom: 2px;
      color: #716b91;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 900;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 2.5vw, 12px);
      perspective: 900px;
    }

    .card {
      position: relative;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 20px;
      background: transparent;
      box-shadow: var(--shadow);
      cursor: pointer;
      aspect-ratio: 0.78;
      transform-style: preserve-3d;
      transition: transform 350ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 200ms ease;
      touch-action: manipulation;
    }

    .card:active:not(.flipped):not(.matched) {
      box-shadow: 0 3px 0 rgba(48, 44, 77, 0.18);
      transform: translateY(4px) scale(0.98);
    }

    .card.flipped,
    .card.matched {
      transform: rotateY(180deg);
    }

    .card.matched {
      box-shadow: 0 7px 0 rgba(49, 195, 140, 0.28);
      animation: celebrate 500ms ease;
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 4px solid var(--white);
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      color: var(--white);
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.32) 0 9%, transparent 10%) 0 0 / 26px 26px,
        linear-gradient(145deg, var(--purple), var(--pink));
      font-size: clamp(1.5rem, 8vw, 2.4rem);
      text-shadow: 0 3px 0 rgba(48, 44, 77, 0.25);
    }

    .card-front {
      background: linear-gradient(145deg, #ffffff, var(--cream));
      font-size: clamp(2.2rem, 12vw, 4rem);
      transform: rotateY(180deg);
    }

    .card.matched .card-front {
      border-color: #72e6b6;
      background: linear-gradient(145deg, #edfff7, #c8ffe7);
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .restart {
      min-height: 52px;
      padding: 12px 24px;
      border: 3px solid var(--white);
      border-radius: 18px;
      color: var(--white);
      background: linear-gradient(145deg, var(--pink), #e84d93);
      box-shadow: 0 7px 0 #b93471;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .restart:active {
      box-shadow: 0 3px 0 #b93471;
      transform: translateY(4px);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(48, 44, 77, 0.58);
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .win-panel {
      width: min(100%, 380px);
      padding: 28px 22px;
      border: 5px solid var(--white);
      border-radius: 30px;
      background: linear-gradient(160deg, #fff8ce, #ffd0e4);
      box-shadow: 0 14px 0 rgba(48, 44, 77, 0.3);
      text-align: center;
      transform: scale(0.8);
      transition: transform 300ms cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    .overlay.visible .win-panel {
      transform: scale(1);
    }

    .trophy {
      display: block;
      font-size: 4.5rem;
      animation: bounce 900ms ease infinite alternate;
    }

    .win-panel h2 {
      margin: 6px 0 8px;
      color: var(--purple-dark);
      font-size: 2rem;
    }

    .win-panel p {
      margin: 8px 0 20px;
      font-weight: 800;
      line-height: 1.5;
    }

    .play-again {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 18px;
      color: var(--white);
      background: linear-gradient(145deg, var(--purple), var(--purple-dark));
      box-shadow: 0 7px 0 #342fa0;
      font-weight: 900;
      cursor: pointer;
    }

    .play-again:active {
      box-shadow: 0 3px 0 #342fa0;
      transform: translateY(4px);
    }

    @keyframes celebrate {
      0%, 100% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.12); }
    }

    @keyframes bounce {
      from { transform: translateY(0) rotate(-5deg); }
      to { transform: translateY(-10px) rotate(5deg); }
    }

    @media (max-width: 350px) {
      .board { gap: 7px; }
      .card, .card-face { border-radius: 15px; }
      .card-face { border-width: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="menu-link" href="./" aria-label="Back to game menu">‹</a>
  <main class="game">
    <h1 class="title">Critter Match!</h1>
    <p class="subtitle">Find all eight cartoon animal pairs.</p>

    <section class="scoreboard" aria-label="Game statistics">
      <div class="stat">
        <span class="stat-label">Moves</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="time">0:00</span>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span>
        <span class="stat-value" id="best">—</span>
      </div>
    </section>

    <section class="board" id="board" aria-label="Cartoon animal matching cards"></section>

    <div class="controls">
      <button class="restart" id="restart" type="button">↻ New Game</button>
    </div>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <section class="win-panel">
      <span class="trophy" aria-hidden="true">🏆</span>
      <h2 id="win-title">You Did It!</h2>
      <p id="result">All the critters found their friends.</p>
      <button class="play-again" id="play-again" type="button">Play Again</button>
    </section>
  </div>

  <script>
    "use strict";

    const ANIMALS = ["🐶", "🐱", "🐼", "🦊", "🐸", "🐵", "🦁", "🐰"];
    const STORAGE_KEY = "critter-match-best-v1";

    const board = document.getElementById("board");
    const movesDisplay = document.getElementById("moves");
    const timeDisplay = document.getElementById("time");
    const bestDisplay = document.getElementById("best");
    const restartButton = document.getElementById("restart");
    const overlay = document.getElementById("overlay");
    const result = document.getElementById("result");
    const playAgainButton = document.getElementById("play-again");

    let firstCard = null;
    let secondCard = null;
    let boardLocked = false;
    let moves = 0;
    let matchedPairs = 0;
    let elapsedSeconds = 0;
    let timerId = null;
    let gameStarted = false;
    let gameToken = 0;
    let audioContext = null;

    function shuffle(items) {
      const shuffled = [...items];

      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
      }

      return shuffled;
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    function readBestScore() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

        if (
          saved &&
          Number.isInteger(saved.moves) &&
          Number.isInteger(saved.time) &&
          saved.moves > 0 &&
          saved.time >= 0
        ) {
          return saved;
        }
      } catch (error) {
        console.warn("The saved score could not be read.", error);
      }

      return null;
    }

    function saveBestScore(score) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(score));
      } catch (error) {
        console.warn("The best score could not be saved.", error);
      }
    }

    function updateBestDisplay() {
      const best = readBestScore();
      bestDisplay.textContent = best ? `${best.moves} moves` : "—";
    }

    function isBetterScore(current, previous) {
      if (!previous) {
        return true;
      }

      if (current.moves !== previous.moves) {
        return current.moves < previous.moves;
      }

      return current.time < previous.time;
    }

    function updateTimer() {
      elapsedSeconds += 1;
      timeDisplay.textContent = formatTime(elapsedSeconds);
    }

    function startTimer() {
      if (gameStarted) {
        return;
      }

      gameStarted = true;
      timerId = window.setInterval(updateTimer, 1000);
    }

    function stopTimer() {
      if (timerId !== null) {
        window.clearInterval(timerId);
        timerId = null;
      }
    }

    function playTone(frequency, duration, delay = 0) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
          return;
        }

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }

        const start = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.12, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.03);
      } catch (error) {
        console.warn("Audio is unavailable.", error);
      }
    }

    function createCard(animal, index) {
      const card = document.createElement("button");

      card.type = "button";
      card.className = "card";
      card.dataset.animal = animal;
      card.dataset.index = String(index);
      card.setAttribute("aria-label", "Hidden cartoon card");
      card.setAttribute("aria-pressed", "false");

      const back = document.createElement("span");
      back.className = "card-face card-back";
      back.setAttribute("aria-hidden", "true");
      back.textContent = "?";

      const front = document.createElement("span");
      front.className = "card-face card-front";
      front.setAttribute("aria-hidden", "true");
      front.textContent = animal;

      card.append(back, front);
      card.addEventListener("click", handleCardClick);
      return card;
    }

    function flipCard(card) {
      card.classList.add("flipped");
      card.setAttribute("aria-pressed", "true");
      card.setAttribute("aria-label", `Revealed card: ${card.dataset.animal}`);
    }

    function hideCard(card) {
      card.classList.remove("flipped");
      card.setAttribute("aria-pressed", "false");
      card.setAttribute("aria-label", "Hidden cartoon card");
    }

    function resetSelection() {
      firstCard = null;
      secondCard = null;
      boardLocked = false;
    }

    function handleCardClick(event) {
      const selectedCard = event.currentTarget;

      if (
        boardLocked ||
        selectedCard === firstCard ||
        selectedCard.classList.contains("matched")
      ) {
        return;
      }

      startTimer();
      flipCard(selectedCard);
      playTone(460, 0.08);

      if (!firstCard) {
        firstCard = selectedCard;
        return;
      }

      secondCard = selectedCard;
      boardLocked = true;
      moves += 1;
      movesDisplay.textContent = String(moves);

      if (firstCard.dataset.animal === secondCard.dataset.animal) {
        handleMatch();
      } else {
        handleMismatch();
      }
    }

    function handleMatch() {
      firstCard.classList.add("matched");
      secondCard.classList.add("matched");
      firstCard.disabled = true;
      secondCard.disabled = true;
      matchedPairs += 1;

      playTone(660, 0.12);
      playTone(880, 0.16, 0.1);
      resetSelection();

      if (matchedPairs === ANIMALS.length) {
        finishGame();
      }
    }

    function handleMismatch() {
      const first = firstCard;
      const second = secondCard;
      const currentToken = gameToken;

      window.setTimeout(() => {
        if (currentToken !== gameToken) {
          return;
        }

        hideCard(first);
        hideCard(second);
        playTone(220, 0.1);
        resetSelection();
      }, 850);
    }

    function finishGame() {
      stopTimer();

      const currentScore = { moves, time: elapsedSeconds };
      const previousBest = readBestScore();
      const newBest = isBetterScore(currentScore, previousBest);

      if (newBest) {
        saveBestScore(currentScore);
      }

      updateBestDisplay();
      result.textContent =
        `You matched every pair in ${moves} moves and ${formatTime(elapsedSeconds)}.` +
        (newBest ? " New best score!" : "");

      playTone(523, 0.14);
      playTone(659, 0.14, 0.14);
      playTone(784, 0.22, 0.28);

      window.setTimeout(() => {
        overlay.classList.add("visible");
        playAgainButton.focus();
      }, 450);
    }

    function startNewGame() {
      gameToken += 1;
      stopTimer();
      firstCard = null;
      secondCard = null;
      boardLocked = false;
      moves = 0;
      matchedPairs = 0;
      elapsedSeconds = 0;
      gameStarted = false;
      movesDisplay.textContent = "0";
      timeDisplay.textContent = "0:00";
      overlay.classList.remove("visible");
      board.replaceChildren();

      const deck = shuffle([...ANIMALS, ...ANIMALS]);
      const cards = deck.map(createCard);
      board.append(...cards);
      updateBestDisplay();
    }

    restartButton.addEventListener("click", startNewGame);
    playAgainButton.addEventListener("click", startNewGame);
    startNewGame();
  </script>
</body>
</html>
